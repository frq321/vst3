name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSPATIALPAN_BUILD_TESTS=ON "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Build plugin
        run: cmake --build build --config Release --target SpatialPan_VST3 --parallel 4

      - name: Build and run DSP tests
        shell: bash
        run: |
          cmake --build build --config Release --target SpatialPanTests --parallel 4
          ctest --test-dir build -C Release --output-on-failure

      - name: Collect VST3
        shell: bash
        run: |
          mkdir -p dist
          cp -R build/SpatialPan_artefacts/Release/VST3/*.vst3 dist/

      - uses: actions/upload-artifact@v4
        with:
          name: SpatialPan-VST3-${{ runner.os }}
          path: dist
